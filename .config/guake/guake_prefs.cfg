[general]
compat-delete='delete-sequence'
default-shell='/usr/bin/zsh'
display-n=0
display-tab-names=0
gtk-use-system-default-theme=true
hide-tabs-if-one-tab=false
history-size=1000
load-guake-yml=true
max-tab-name-length=100
mouse-display=true
open-tab-cwd=true
prompt-on-quit=true
quick-open-command-line='gedit %(file_path)s'
restore-tabs-notify=true
restore-tabs-startup=true
save-tabs-when-changed=true
schema-version='3.10.2.dev0'
scroll-keystroke=true
start-at-login=true
start-fullscreen=true
use-default-font=false
use-popup=true
use-scrollbar=true
use-trayicon=true
window-halignment=0
window-height=100
window-losefocus=false
window-refocus=false
window-tabbar=true
window-width=100

[keybindings/global]
show-hide='<Shift>space'

[keybindings/local]
new-tab='<Primary><Shift>t'
next-tab='<Primary><Shift>Tab'
previous-tab='<Primary><Shift>asciitilde'
previous-tab-alt='<Primary><Shift>q'
split-tab-horizontal='<Primary><Shift>Down'
split-tab-vertical='<Primary><Shift>Right'

[style]
cursor-shape=1

[style/background]
transparency=63

[style/font]
allow-bold=true
palette='#000000000000:#f6f66a6a8484:#c2c2eaea8a8a:#ffffcbcb6b6b:#8282abaafdfd:#c2c2eaea8a8a:#8989dddcffff:#deded9d9cece:#aaaaaaaaaaaa:#f5f58b8b7f7f:#41d2bfff3fff:#eeeee5e5b2b2:#8282abaafdfd:#ddddaaaaffff:#b6b6fffff9f9:#fefefffffefe:#ffffffffffff:#2a2a2d2d3e3e'
palette-name='Custom'
style='Fira Code weight=450 12'
