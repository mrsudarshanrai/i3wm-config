[[block]]
block = "uptime"
interval = 3600
format = " $icon UPTIME $text "
[block.theme_overrides]
idle_bg = "#000000"
idle_fg = "#f4d35e"
[block.icons_overrides]

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %r') "
[block.theme_overrides]
idle_bg = "#000000"
idle_fg = "#e3d985"
[block.icons_overrides]

