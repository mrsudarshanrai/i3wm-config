icons_format = "{icon}"


[icons]
icons = "awesome6"
[icons.overrides]


[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#000000"
idle_fg = "#abcdef"

[[block]]
block = "custom"
command = "echo \uf017"
interval = "once"
[[block.click]]
button = "left"
cmd = "~/timedoctor2/timedoctor2"
[block.theme_overrides]
idle_bg = "#000000"
idle_fg = "#53a548"
[block.icons_overrides]

[[block]]
block = "custom"
command = "echo \uf26c"
interval = "once"
[[block.click]]
button = "left"
cmd = "xrandr --output eDP-1 --mode 1920x1080 --pos 0x1080 --rotate normal --output HDMI-1 --mode 1920x1080 --pos 0x0 --rotate normal"

[[block]]
block = "focused_window"
[block.format]
full = " $title.str(max_w:15) |"
short = " $title.str(max_w:10) |"

[block.theme_overrides]
idle_bg = "#000000"
idle_fg = "#f7accf"
[block.icons_overrides]

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid $frequency|Wired connection} via $device "
[block.theme_overrides]

idle_bg = "#000000"
idle_fg = "#04e824"
[block.icons_overrides]

[[block]]
block = "sound"
[[block.click]]
button = "left"
[block.theme_overrides]
idle_bg = "#000000"
idle_fg = "#8651c9"
[block.icons_overrides]
cmd = "pavucontrol"


[[block]]
block = "battery"
[block.theme_overrides]
idle_bg = "#000000"
idle_fg = "#8651c9"
[block.icons_overrides]
format = " $icon BATTERY $percentage " 

